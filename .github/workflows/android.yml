name: android-apk-aab
on:
  push:
    branches: [main, cursor/blokmotor-3d-engine-6e3f]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Hazırla Android proje
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R web/. android/app/src/main/assets/www/
      - name: Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.2.1 || true
          if [ ! -f gradlew ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew
      - name: APK ve AAB
        working-directory: android
        run: |
          ./gradlew assembleDebug bundleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: blokmotor-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
